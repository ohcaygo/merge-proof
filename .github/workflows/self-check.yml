name: self-check

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: reading the repository is all this workflow needs.
permissions:
  contents: read

jobs:
  test:
    name: tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          # merge-proof reasons about history, so it needs all of it.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        run: npm test

  dogfood:
    name: merge-proof checks itself
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify this pull request with merge-proof
        uses: ./
        id: mp
        with:
          fail-on: none
      - name: Report verdict
        env:
          MP_VERDICT: ${{ steps.mp.outputs.verdict }}
        run: |
          echo "merge-proof verdict: $MP_VERDICT"
          test "$MP_VERDICT" != "FAIL"

  pilot-report:
    name: public pilot HTML and PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate YAML with a full parser
        run: |
          python -m pip install PyYAML==6.0.2
          python -c 'import pathlib, yaml; [yaml.safe_load(p.read_text()) for p in [pathlib.Path("action.yml"), *pathlib.Path(".github/workflows").glob("*.yml")]]'
      - name: Test PDF export and generate the public sample
        run: |
          node test/pilot-report.js --pdf
          npm run report:sample
      - uses: actions/upload-artifact@v4
        with:
          name: kiota-pilot-report
          path: output/kiota.*
          if-no-files-found: error

  no-dependencies:
    name: dependency surface stays empty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert no dependencies are declared or installed
        run: |
          set -euo pipefail
          node -e '
            const pkg = require("./package.json");
            const counts = [Object.keys(pkg.dependencies || {}).length, Object.keys(pkg.devDependencies || {}).length];
            if (counts.some((n) => n > 0)) { console.error("merge-proof must stay dependency-free"); process.exit(1); }
            console.log("dependencies: none");
          '
          test ! -d node_modules || { echo "node_modules must not be committed"; exit 1; }
